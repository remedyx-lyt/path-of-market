spring.application.name=path-of-market-server

# 第一版只在本机运行，端口可以通过启动脚本覆盖。
server.address=127.0.0.1
server.port=8080

# Python 服务地址与等待上限，可通过进程环境变量或启动参数覆盖。
agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:8000}
agent.connect-timeout=${AGENT_CONNECT_TIMEOUT:3s}
agent.request-timeout=${AGENT_REQUEST_TIMEOUT:10s}
